<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTCouch - <%= treino.nome %></title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/var.css">
    <link rel="stylesheet" href="/static/css/exercicios.css">
    <link rel="stylesheet" href="/static/css/config_index.css">
    <style>
        /* Estilos para a tela de carregamento */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8); /* Fundo semi-transparente */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Garante que fique sobre tudo */
            color: white;
            font-size: 18px;
            flex-direction: column;
        }
        #loading-spinner {
            border: 4px solid #f3f3f3; /* Cor de fundo */
            border-top: 4px solid #3498db; /* Cor do spinner */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite; /* Animação de rotação */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden {
            display: none; /* Classe para ocultar */
        }
    </style>
</head>
<body>

<!-- Tela de Carregamento -->
<div id="loading-overlay">
    <div id="loading-spinner"></div>
    <p>Carregando treino...</p>
</div>

<!-- Seu conteúdo existente -->
<div class="parent">
    <!-- ... resto do seu HTML ... -->
</div>

<script>
    // JavaScript para ocultar a tela de carregamento
    window.addEventListener('DOMContentLoaded', function() {
        // Simula um atraso de carregamento (remova ou ajuste para carregamento real)
        setTimeout(function() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }, 2000); // 2 segundos; substitua por lógica real, ex.: após carregar dados via AJAX
    });
</script>

<!-- Seu script existente -->
<script src="/static/script/exercicios.js"></script>
</body>
</html>
